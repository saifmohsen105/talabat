name: talabat_clone
description: A clean food delivery starter built with Flutter and Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  provider: ^6.1.5+1
  go_router: ^18.1.2
  geocoding: ^5.0.1
  geolocator: ^14.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
